name: Ubuntu
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    paths-ignore:
    - 'doc/**'
    - '**/man/*'
    - '**.md'
    - '**.rdoc'
    - '**/.document'
    - '.*.yml'
  pull_request:
    # Do not use paths-ignore for required status checks
    # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks#handling-skipped-but-required-checks
  merge_group:

concurrency:
  group: ${{ github.workflow }} / ${{ startsWith('push', 'pull') && github.ref_name || github.sha }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  # Work around transient crates.io download failures (curl HTTP/2 framing / partial transfer)
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

run-name: "Ubuntu ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  make:
    strategy:
      matrix:
        # We enumerate every job in matrix.include to save build time
        include:
        - test_task: check
          configure: 'cppflags=-DVM_CHECK_MODE'
        - test_task: check
          arch: i686
        - test_task: check
          configure: '--disable-yjit'
        - test_task: check
          configure: '--enable-shared --enable-load-relative'
        - test_task: test-bundler-parallel
          timeout: 50
        - test_task: test-bundled-gems
        - test_task: check
          os: ubuntu-24.04
          extra_checks: [capi]
        - test_task: check
          os: ubuntu-24.04
          configure: 'CC=clang-18 cflags=-fsanitize=address cppflags=-DUSE_MN_THREADS=0'
          timeout: 60
        - test_task: check
          os: ubuntu-26.04-arm
      fail-fast: false

    env:
      GITPULLOPTIONS: --no-tags origin ${{ github.ref }}
      RUBY_DEBUG: ci

    runs-on: ${{ matrix.os || 'ubuntu-22.04' }}

    if: >-
      ${{!(false
      || contains(github.event.head_commit.message, '[DOC]')
      || contains(github.event.pull_request.title, '[DOC]')
      || contains(github.event.pull_request.labels.*.name, 'Documentation')
      || (github.event.pull_request.user.login == 'dependabot[bot]')
      )}}

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        sparse-checkout-cone-mode: false
        sparse-checkout: /.github
        persist-credentials: false
    - uses: ./.github/actions/setup/ubuntu
      with:
        arch: ${{ matrix.arch }}

    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b   # v1.321.0
      with:
        ruby-version: '3.1'
        bundler: none
      if: >-
        ${{ !endsWith(matrix.os, 'arm')
        && !endsWith(matrix.os, 'ppc64le') && !endsWith(matrix.os, 's390x') }}

    - uses: ./.github/actions/setup/directories
      with:
        srcdir: src
        builddir: build
        makeup: true
        clean: true
        dummy-files: ${{ matrix.test_task == 'check' }}
        bundled-gems-src-cache: ${{ matrix.test_task == 'test-bundled-gems' }}
          # Set fetch-depth: 10 so that Launchable can receive commits information.
        fetch-depth: 10

    - name: Run configure
      env:
        arch: ${{ matrix.arch }}
        configure: ${{ matrix.configure }}
      run: >-
        $SETARCH ../src/configure -C --disable-install-doc ${configure:- --enable-debug-env cppflags=-DRUBY_DEBUG}
        ${arch:+--target=$arch-$OSTYPE --host=$arch-$OSTYPE}

    - run: $SETARCH make prepare-gems
      if: ${{ matrix.test_task == 'test-bundled-gems' }}

    - run: $SETARCH make

    - run: $SETARCH make hello

    - name: runirb
      run: |
        echo IRB::VERSION | $SETARCH make runirb RUNOPT="-- -f"

    - name: Set test options for skipped tests
      run: |
        set -x
        TESTS="$(echo "${{ matrix.skipped_tests }}" | sed 's| |$$/ -n!/|g;s|^|-n!/|;s|$|$$/|')"
        echo "TESTS=${TESTS}" >> $GITHUB_ENV
      if: ${{ matrix.test_task == 'check' && matrix.skipped_tests }}

    - name: Set up Launchable
      id: launchable
      uses: ./.github/actions/launchable/setup
      with:
        os: ${{ matrix.os || 'ubuntu-22.04' }}
        test-opts: ${{ matrix.configure }}
        launchable-token: ${{ secrets.LAUNCHABLE_TOKEN }}
        builddir: build
        srcdir: src
      continue-on-error: true
      timeout-minutes: 3

      # Avoid possible test failures with the zlib applying the following patch
      # on s390x CPU architecture.
      # https://github.com/madler/zlib/pull/410
    - name: Disable DFLTCC
      run: echo "DFLTCC=0" >> $GITHUB_ENV
      if: ${{ endsWith(matrix.os, 's390x') }}

      # Emulated ppc64le/s390x runners are slow enough that subprocess
      # assertion timeouts (e.g. assert_separately) flake. Scale them up, as
      # macos.yml does for slower/contended runners. SYNTAX_SUGGEST_TIMEOUT
      # covers syntax_suggest's own internal search timeout, which
      # RUBY_TEST_TIMEOUT_SCALE does not affect. Note: setting SYNTAX_SUGGEST_TIMEOUT
      # also activates the "does not timeout on massive files" integration test, so
      # it must be large enough for the slower architecture to complete the search.
    - name: Set timeout scale for emulated runners
      run: |
        echo "RUBY_TEST_TIMEOUT_SCALE=10" >> $GITHUB_ENV
        echo "SYNTAX_SUGGEST_TIMEOUT=60" >> $GITHUB_ENV
      if: ${{ endsWith(matrix.os, 'ppc64le') || endsWith(matrix.os, 's390x') }}

    - name: make ${{ matrix.test_task }}
      run: |
        test -n "${LAUNCHABLE_STDOUT}" && exec 1> >(tee "${LAUNCHABLE_STDOUT}")
        test -n "${LAUNCHABLE_STDERR}" && exec 2> >(tee "${LAUNCHABLE_STDERR}")

        $SETARCH make -s ${{ matrix.test_task }} \
        ${TESTS:+TESTS="$TESTS"} \
        ${{ !contains(matrix.test_task, 'bundle') && 'RUBYOPT=-w' || '' }}
      timeout-minutes: ${{ matrix.timeout || 40 }}
      env:
        RUBY_TESTOPTS: '-q --tty=no'
        TEST_BUNDLED_GEMS_ALLOW_FAILURES: ''
        PRECHECK_BUNDLED_GEMS: 'no'
        LAUNCHABLE_STDOUT: ${{ steps.launchable.outputs.stdout_report_path }}
        LAUNCHABLE_STDERR: ${{ steps.launchable.outputs.stderr_report_path }}

    - name: make skipped tests
      run: |
        $SETARCH make -s test-all TESTS="${TESTS//-n!\//-n/}"
      env:
        GNUMAKEFLAGS: ''
        RUBY_TESTOPTS: '-v --tty=no'
      if: ${{ matrix.test_task == 'check' && matrix.skipped_tests }}
      continue-on-error: ${{ matrix.continue-on-skipped_tests || false }}

    - name: test-pc
      run: |
        DESTDIR=${RUNNER_TEMP-${TMPDIR-/tmp}}/installed
        $SETARCH make test-pc "DESTDIR=$DESTDIR"

    - name: CAPI extensions
      uses: ./.github/actions/capiext
      with:
        builddir: build
        make: '$SETARCH make'
      env:
        RUBY_TESTOPTS: '-v --tty=no'
      if: ${{ contains(matrix.extra_checks, 'capi') }}

    - uses: ./.github/actions/slack
      with:
        label: ${{ matrix.test_task }} ${{ matrix.configure }}${{ matrix.arch }}${{ matrix.os }}
        SLACK_WEBHOOK_URL: ${{ secrets.SIMPLER_ALERTS_URL }}   # ruby-lang slack: ruby/simpler-alerts-bot
      if: ${{ failure() }}

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  ruby-bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Using the same setup as ZJIT jobs
        - bench_opts: '--warmup=1 --bench=1 --excludes=shipit'

    runs-on: ubuntu-24.04

    if: >-
      ${{!(false
      || contains(github.event.head_commit.message, '[DOC]')
      || contains(github.event.pull_request.title, '[DOC]')
      || contains(github.event.pull_request.labels.*.name, 'Documentation')
      || (github.event.pull_request.user.login == 'dependabot[bot]')
      )}}

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        persist-credentials: false
    - uses: ./.github/actions/setup/ubuntu

    - uses: ./.github/actions/setup/directories
      with:
        srcdir: src
        builddir: build
        makeup: true

    - name: Run configure
      run: ../src/configure -C --disable-install-doc --prefix="$(pwd)/install"

    - run: make install

    - name: Checkout ruby-bench
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        repository: ruby/ruby-bench
        persist-credentials: false
        path: ruby-bench

      # If you want to skip failing benchmark, consider using `--excludes`.
      # e.g. `bench_opts: '--warmup=1 --bench=1 --excludes=railsbench,lobsters'`
    - name: Run ruby-bench
      run: ruby run_benchmarks.rb -e "ruby::../build/install/bin/ruby" ${{ matrix.bench_opts }}
      working-directory: ruby-bench
      env:
        BUNDLER_VERSION: 0

    - uses: ./.github/actions/slack
      with:
        label: ruby-bench ${{ matrix.bench_opts }} ${{ matrix.ruby_opts }}
        SLACK_WEBHOOK_URL: ${{ secrets.SIMPLER_ALERTS_URL }}   # ruby-lang slack: ruby/simpler-alerts-bot
      if: ${{ failure() }}

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  result:
    if: ${{ always() }}
    name: ${{ github.workflow }} result
    runs-on: ubuntu-latest
    needs: [make]
    steps:
    - run: exit 1
      working-directory:
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}

defaults:
  run:
    working-directory: build
